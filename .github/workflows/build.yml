name: Build APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build phone and watch APKs
        run: gradle :phone:assembleDebug :watch:assembleDebug --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          cp phone/build/outputs/apk/debug/phone-debug.apk out/WatchLink-Phone.apk
          cp watch/build/outputs/apk/debug/watch-debug.apk out/WatchLink-Watch.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: out/*.apk

      # Fixed download links:
      # https://github.com/<owner>/<repo>/releases/download/latest/WatchLink-Watch.apk
      # https://github.com/<owner>/<repo>/releases/download/latest/WatchLink-Phone.apk
      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/*.apk \
            --title "Build ${{ github.run_number }}" \
            --notes "Commit ${{ github.sha }}" \
            --latest
